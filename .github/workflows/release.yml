name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag
        run: scripts/verify-tag.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}"

      - name: Export version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

  client-binaries:
    needs: gate
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"

      - name: Test Go packages
        run: go test ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Install framesplayer dependencies
        working-directory: apps/framesplayer
        run: bun install --frozen-lockfile

      - name: Test framesplayer
        working-directory: apps/framesplayer
        run: bun test

      - name: Typecheck framesplayer
        working-directory: apps/framesplayer
        run: bun run typecheck

      - name: Package client binaries
        run: scripts/package-release.sh "${{ needs.gate.outputs.version }}" dist/release

      - name: Write checksums
        working-directory: dist/release
        run: shasum -a 256 *.tar.gz > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.gate.outputs.version }}" \
            --title "${{ needs.gate.outputs.version }}" \
            --generate-notes \
            dist/release/*.tar.gz \
            dist/release/SHA256SUMS
