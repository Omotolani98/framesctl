name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag
        run: scripts/verify-tag.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}"

      - name: Export version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

  client-binaries:
    needs: gate
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"

      - name: Test Go packages
        run: go test ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Install framesplayer dependencies
        working-directory: apps/framesplayer
        run: bun install --frozen-lockfile

      - name: Test framesplayer
        working-directory: apps/framesplayer
        run: bun test

      - name: Typecheck framesplayer
        working-directory: apps/framesplayer
        run: bun run typecheck

      - name: Package client binaries
        run: scripts/package-release.sh "${{ needs.gate.outputs.version }}" dist/release

      - name: Smoke compiled framesplayer
        run: sh scripts/smoke-framesplayer-compiled.sh "dist/release/package/framesctl_${{ needs.gate.outputs.version }}_darwin_arm64/framesplayer"

      - name: Write checksums
        working-directory: dist/release
        run: shasum -a 256 *.tar.gz > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.gate.outputs.version }}" \
            --title "${{ needs.gate.outputs.version }}" \
            --generate-notes \
            dist/release/*.tar.gz \
            dist/release/SHA256SUMS

  server-images:
    needs:
      - gate
      - client-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish server images
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          framesrvr="ghcr.io/${owner}/framesrvr"
          framesworker="ghcr.io/${owner}/framesworker"

          latest_args=""
          case "$VERSION" in
            *-*) ;;
            *) latest_args="--tag ${framesrvr}:latest" ;;
          esac

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" \
            --tag "${framesrvr}:${VERSION}" \
            $latest_args \
            --push \
            -f Dockerfile .

          latest_args=""
          case "$VERSION" in
            *-*) ;;
            *) latest_args="--tag ${framesworker}:latest" ;;
          esac

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" \
            --tag "${framesworker}:${VERSION}" \
            $latest_args \
            --push \
            -f Dockerfile.framesworker .
